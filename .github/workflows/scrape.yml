name: Scrape Grocery Prices

on:
  schedule:
    # Tuesday 6am AEST (UTC+10) = Monday 20:00 UTC
    - cron: '0 20 * * 1'
    # Wednesday 6am AEST (UTC+10) = Tuesday 20:00 UTC
    - cron: '0 20 * * 2'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Puppeteer dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Install Node dependencies
        run: npm install puppeteer axios cheerio node-cron

      - name: Run scraper
        env:
          TZ: UTC
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
        run: node scraper.js

      - name: Check scrape result
        run: |
          if [ -f products.json ]; then
            TOTAL=$(node -e "const d=require('./products.json'); console.log(d.summary.totalProducts)")
            echo "Total products scraped: $TOTAL"
            if [ "$TOTAL" -lt 20 ]; then
              echo "WARNING: Low product count ($TOTAL). Scraper may be blocked."
            fi
          else
            echo "ERROR: products.json was not created"
            exit 1
          fi

      - name: Commit updated products.json
        run: |
          git config user.name "Trolley Bot"
          git config user.email "actions@github.com"

          if git diff --quiet products.json; then
            echo "No changes to products.json — skipping commit"
          else
            git add products.json
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: update grocery prices [$TIMESTAMP]"
            git push
            echo "Committed and pushed updated products.json"
          fi

      - name: Upload scrape log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: scrape-log.txt
          retention-days: 7
